<input type="hidden" name="data" value="{&quot;title&quot;: &quot;DKT 2027 Kick-Off Stage 3D&quot;, &quot;description&quot;: &quot;Interactive 3D stage with Front, Top, Side and 3D views.&quot;, &quot;html&quot;: &quot;&lt;!-- DKT 2027 Kick-Off: interactive 3D stage. Front / Top / Side / 3D switch. --&gt;\n&lt;link rel=\&quot;stylesheet\&quot; href=\&quot;https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap\&quot;&gt;\n&lt;div class=\&quot;wrap\&quot;&gt;\n  &lt;header&gt;\n    &lt;div&gt;\n      &lt;p class=\&quot;eyebrow\&quot;&gt;DKT 2027 Kick-Off \u00b7 Stage&lt;/p&gt;\n      &lt;h1&gt;Go Beyond! stage in 3D&lt;/h1&gt;\n    &lt;/div&gt;\n    &lt;div class=\&quot;switch\&quot; role=\&quot;group\&quot; aria-label=\&quot;Choose view\&quot;&gt;\n      &lt;span class=\&quot;thumb\&quot; aria-hidden=\&quot;true\&quot;&gt;&lt;/span&gt;\n      &lt;button type=\&quot;button\&quot; id=\&quot;btn-front\&quot; data-view=\&quot;front\&quot; aria-pressed=\&quot;true\&quot;&gt;Front&lt;/button&gt;\n      &lt;button type=\&quot;button\&quot; id=\&quot;btn-top\&quot; data-view=\&quot;top\&quot; aria-pressed=\&quot;false\&quot;&gt;Top&lt;/button&gt;\n      &lt;button type=\&quot;button\&quot; id=\&quot;btn-side\&quot; data-view=\&quot;side\&quot; aria-pressed=\&quot;false\&quot;&gt;Side&lt;/button&gt;\n      &lt;button type=\&quot;button\&quot; id=\&quot;btn-free\&quot; data-view=\&quot;free\&quot; aria-pressed=\&quot;false\&quot;&gt;3D&lt;/button&gt;\n    &lt;/div&gt;\n  &lt;/header&gt;\n\n  &lt;div class=\&quot;main\&quot;&gt;\n    &lt;div&gt;\n      &lt;div class=\&quot;viewport\&quot; id=\&quot;vp\&quot;&gt;\n        &lt;canvas id=\&quot;c\&quot; aria-label=\&quot;3D model of the stage. Drag to rotate, scroll or pinch to zoom.\&quot;&gt;&lt;/canvas&gt;\n        &lt;span class=\&quot;tag\&quot; id=\&quot;tag\&quot;&gt;FRONT&lt;/span&gt;\n        &lt;span class=\&quot;loading\&quot; id=\&quot;loading\&quot;&gt;Loading 3D model\u2026&lt;/span&gt;\n      &lt;/div&gt;\n      &lt;p class=\&quot;hint\&quot;&gt;Drag to rotate, right-drag or two fingers to pan, scroll or pinch to zoom. Keys 1 to 4 switch views.&lt;/p&gt;\n    &lt;/div&gt;\n\n    &lt;aside&gt;\n      &lt;h2&gt;Stage and gear&lt;/h2&gt;\n      &lt;p class=\&quot;sub\&quot;&gt;Lights&lt;/p&gt;\n      &lt;dl&gt;\n        &lt;dt&gt;6&lt;/dt&gt;&lt;dd&gt;LED strobe panels&lt;small&gt;Hung under the top truss, behind the LED wall&lt;/small&gt;&lt;/dd&gt;\n        &lt;dt&gt;4&lt;/dt&gt;&lt;dd&gt;Moving heads&lt;small&gt;On the top truss, between the strobes&lt;/small&gt;&lt;/dd&gt;\n        &lt;dt&gt;6&lt;/dt&gt;&lt;dd&gt;Beam moving heads&lt;small&gt;Row on the deck, in front of the LED wall and wings&lt;/small&gt;&lt;/dd&gt;\n      &lt;/dl&gt;\n      &lt;p class=\&quot;sub\&quot;&gt;Audio&lt;/p&gt;\n      &lt;dl&gt;\n        &lt;dt&gt;2&lt;/dt&gt;&lt;dd&gt;Wedge monitors&lt;small&gt;Stage front, facing the presenter&lt;/small&gt;&lt;/dd&gt;\n        &lt;dt&gt;4&lt;/dt&gt;&lt;dd&gt;Surround speakers on tripods&lt;small&gt;2 front, 2 back, both sides of the room&lt;/small&gt;&lt;/dd&gt;\n      &lt;/dl&gt;\n      &lt;p class=\&quot;sub\&quot;&gt;Stage&lt;/p&gt;\n      &lt;dl&gt;\n        &lt;dt&gt;&amp;nbsp;&lt;/dt&gt;&lt;dd&gt;Deck 17.1 \u00d7 4.9 m, 0.6 m (2 ft) high&lt;/dd&gt;\n        &lt;dt&gt;&amp;nbsp;&lt;/dt&gt;&lt;dd&gt;Center LED 6 \u00d7 4 m, wings 3 m wide with angled tops&lt;/dd&gt;\n        &lt;dt&gt;&amp;nbsp;&lt;/dt&gt;&lt;dd&gt;Truss 16 m span at the back of the stage, bottom at 5.5 m&lt;/dd&gt;\n      &lt;/dl&gt;\n    &lt;/aside&gt;\n  &lt;/div&gt;\n&lt;/div&gt;\n\n&lt;script type=\&quot;importmap\&quot;&gt;\n{\&quot;imports\&quot;:{\&quot;three\&quot;:\&quot;https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js\&quot;,\n\&quot;three/addons/\&quot;:\&quot;https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/\&quot;}}\n&lt;/script&gt;\n&lt;script type=\&quot;module\&quot;&gt;\nimport * as THREE from &#x27;three&#x27;;\nimport {OrbitControls} from &#x27;three/addons/controls/OrbitControls.js&#x27;;\nimport {GLTFLoader} from &#x27;three/addons/loaders/GLTFLoader.js&#x27;;\n\n\nconst GLB_URL = \&quot;https://kikodacanay14.github.io/Trick-or-Treat-Manila-3D-viewer/dkt-stage-3d/dkt-stage.glb\&quot;;\nconst BEAMS = [{\&quot;x\&quot;: -7.781581878662109, \&quot;y\&quot;: 3.0, \&quot;z\&quot;: 2.897839069366455, \&quot;tilt\&quot;: -0.15707963705062866, \&quot;len\&quot;: 3.5999999046325684}, {\&quot;x\&quot;: -4.6693949699401855, \&quot;y\&quot;: 3.0, \&quot;z\&quot;: 2.9120116233825684, \&quot;tilt\&quot;: -0.09424778074026108, \&quot;len\&quot;: 3.599999189376831}, {\&quot;x\&quot;: -1.5565394163131714, \&quot;y\&quot;: 3.0, \&quot;z\&quot;: 2.919111728668213, \&quot;tilt\&quot;: -0.03141592815518379, \&quot;len\&quot;: 3.599999189376831}, {\&quot;x\&quot;: 1.5565394163131714, \&quot;y\&quot;: 3.0, \&quot;z\&quot;: 2.919111728668213, \&quot;tilt\&quot;: 0.03141592815518379, \&quot;len\&quot;: 3.599999189376831}, {\&quot;x\&quot;: 4.6693949699401855, \&quot;y\&quot;: 3.0, \&quot;z\&quot;: 2.9120116233825684, \&quot;tilt\&quot;: 0.09424778074026108, \&quot;len\&quot;: 3.599999189376831}, {\&quot;x\&quot;: 7.781581878662109, \&quot;y\&quot;: 3.0, \&quot;z\&quot;: 2.897839069366455, \&quot;tilt\&quot;: 0.15707963705062866, \&quot;len\&quot;: 3.5999999046325684}];\n\nconst canvas = document.getElementById(&#x27;c&#x27;), vp = document.getElementById(&#x27;vp&#x27;);\nconst renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\nrenderer.outputColorSpace = THREE.SRGBColorSpace;\nrenderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;\nconst scene = new THREE.Scene(); scene.background = new THREE.Color(0x2c2c30);\nconst camera = new THREE.PerspectiveCamera(14, 16/9, 0.5, 600);\nconst controls = new OrbitControls(camera, canvas);\ncontrols.enableDamping = true; controls.maxDistance = 160; controls.minDistance = 2;\n\nscene.add(new THREE.HemisphereLight(0xf2f4ff, 0x40404a, 1.6));\nconst key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-6, 14, 14); scene.add(key);\nconst rim = new THREE.DirectionalLight(0xffffff, 0.6); rim.position.set(12, 8, -10); scene.add(rim);\n\n// Blender (x, y, z) -&gt; three (x, z, -y)\nconst B = (x, y, z) =&gt; new THREE.Vector3(x, z, -y);\nconst VIEWS = {\n  front:{dir:[0,0.04,1],  target:B(0,2.0,3.0), halfW:11.8, halfH:3.4, label:&#x27;FRONT&#x27;, fov:14},\n  top:  {dir:[0,1,0.0001],target:B(0,-1.0,0), halfW:12.5, halfH:7.4, label:&#x27;TOP \u00b7 plan&#x27;, fov:14},\n  side: {dir:[1,0.04,0],  target:B(0,-1.2,3.0),halfW:9.6,  halfH:3.6, label:&#x27;SIDE \u00b7 from stage left&#x27;, fov:14},\n  free: {dir:[-0.55,0.38,0.75],target:B(0,0.5,2.0),halfW:11, halfH:5.5, label:&#x27;3D \u00b7 drag to rotate&#x27;, fov:35}\n};\nfunction pose(v){\n  const p = VIEWS[v], t = Math.tan(THREE.MathUtils.degToRad(p.fov/2));\n  const d = Math.max(p.halfH/t, p.halfW/(t*camera.aspect)) * 1.08;\n  const dir = new THREE.Vector3(...p.dir).normalize();\n  return {pos:p.target.clone().addScaledVector(dir, d), target:p.target.clone(), fov:p.fov};\n}\nlet anim = null;\nfunction go(v, instant){\n  const to = pose(v), from = {pos:camera.position.clone(), target:controls.target.clone(), fov:camera.fov};\n  const reduce = matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;\n  if (instant || reduce){ camera.position.copy(to.pos); controls.target.copy(to.target); camera.fov=to.fov; camera.updateProjectionMatrix(); controls.update(); anim=null; return; }\n  anim = {from, to, t0:performance.now(), dur:700};\n}\n\n// UI: switch\nconst views=[&#x27;front&#x27;,&#x27;top&#x27;,&#x27;side&#x27;,&#x27;free&#x27;];\nconst btns=[...document.querySelectorAll(&#x27;.switch button&#x27;)], thumb=document.querySelector(&#x27;.thumb&#x27;), tag=document.getElementById(&#x27;tag&#x27;);\nlet cur=&#x27;front&#x27;;\nfunction place(){const b=document.getElementById(&#x27;btn-&#x27;+cur);thumb.style.left=b.offsetLeft+&#x27;px&#x27;;thumb.style.width=b.offsetWidth+&#x27;px&#x27;;}\nfunction show(v, push, instant){\n  if(!VIEWS[v]) v=&#x27;front&#x27;; cur=v;\n  btns.forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;, String(b.dataset.view===v)));\n  tag.textContent = VIEWS[v].label; place(); go(v, instant);\n  if(push &amp;&amp; location.hash!==&#x27;#&#x27;+v){ try{history.replaceState(null,&#x27;&#x27;,&#x27;#&#x27;+v);}catch(e){} }\n}\nbtns.forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;show(b.dataset.view,true)));\ndocument.addEventListener(&#x27;keydown&#x27;,e=&gt;{\n  if(e.key&gt;=&#x27;1&#x27;&amp;&amp;e.key&lt;=&#x27;4&#x27;) show(views[+e.key-1],true);\n});\nwindow.addEventListener(&#x27;hashchange&#x27;,()=&gt;show(location.hash.slice(1),false));\ncontrols.addEventListener(&#x27;start&#x27;,()=&gt;{ anim=null; if(cur!==&#x27;free&#x27;){ cur=&#x27;free&#x27;; btns.forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.view===&#x27;free&#x27;))); tag.textContent=VIEWS.free.label; place(); }});\n\nfunction resize(){\n  const w=vp.clientWidth, h=vp.clientHeight; renderer.setSize(w,h,false);\n  camera.aspect=w/h; camera.updateProjectionMatrix(); place();\n}\nnew ResizeObserver(resize).observe(vp); resize();\nif(document.fonts&amp;&amp;document.fonts.ready) document.fonts.ready.then(place);\n\n// Model\nnew GLTFLoader().load(GLB_URL, gltf=&gt;{\n  gltf.scene.traverse(o=&gt;{\n    if(!o.isMesh) return;\n    const m=o.material;\n    if(m.emissiveMap){ m.emissiveIntensity = 1.1; }\n    if(/Lens/.test(m.name)) m.emissiveIntensity = 3;\n  });\n  scene.add(gltf.scene);\n  const beamMat = new THREE.MeshBasicMaterial({color:0xbfd4ff, transparent:true, opacity:0.18, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide});\n  BEAMS.forEach(b=&gt;{\n    const g = new THREE.CylinderGeometry(0.16, 0.04, b.len, 20, 1, true);\n    const m = new THREE.Mesh(g, beamMat); m.position.copy(B(b.x,b.y,b.z)); m.rotation.z = -b.tilt; scene.add(m);\n  });\n  document.getElementById(&#x27;loading&#x27;).remove();\n}, undefined, err=&gt;{ document.getElementById(&#x27;loading&#x27;).textContent=&#x27;The 3D model could not load. Reload the page to try again.&#x27;; console.error(err); });\n\nshow(location.hash.slice(1)||&#x27;front&#x27;, false, true);\n(function loop(now){\n  requestAnimationFrame(loop);\n  if(anim){\n    const k=Math.min(1,(now-anim.t0)/anim.dur), e=k&lt;.5?2*k*k:1-Math.pow(-2*k+2,2)/2;\n    camera.position.lerpVectors(anim.from.pos, anim.to.pos, e);\n    controls.target.lerpVectors(anim.from.target, anim.to.target, e);\n    camera.fov = anim.from.fov + (anim.to.fov-anim.from.fov)*e; camera.updateProjectionMatrix();\n    if(k&gt;=1) anim=null;\n  }\n  controls.update(); renderer.render(scene, camera);\n})(performance.now());\n&lt;/script&gt;\n&lt;script&gt;\n(function(){var W=1320,w=document.querySelector(&#x27;.wrap&#x27;);\nfunction fit(){w.style.transform=&#x27;none&#x27;;var s=Math.min(innerWidth/W,innerHeight/w.offsetHeight);\nw.style.marginLeft=Math.max(0,(innerWidth-W*s)/2)+&#x27;px&#x27;;w.style.transform=&#x27;scale(&#x27;+s+&#x27;)&#x27;;}\naddEventListener(&#x27;resize&#x27;,fit);fit();setTimeout(fit,300);setTimeout(fit,1200);})();\n&lt;/script&gt;&quot;, &quot;css&quot;: &quot;\n/* Layout: one stage drawing in a framed viewport, view switch above it, gear key beside (stacks on phones). */\n:root{\n  --bg:#F3F5F9; --panel:#FFFFFF; --ink:#0B1A33; --muted:#56617A; --line:#D6DCE7;\n  --navy:#0B2A5B; --red:#E2231A; --switch-bg:#E4E9F2; --stage-bg:#3A3936;\n  --f-display:\&quot;Barlow Condensed\&quot;,\&quot;Arial Narrow\&quot;,sans-serif;\n  --f-body:\&quot;IBM Plex Sans\&quot;,system-ui,sans-serif;\n  --f-mono:\&quot;IBM Plex Mono\&quot;,ui-monospace,monospace;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\&quot;light\&quot;]){\n  --bg:#081228; --panel:#0F1D3A; --ink:#E9EEF8; --muted:#9AA6C0; --line:#22345A;\n  --navy:#9DB8F0; --red:#FF4B3F; --switch-bg:#16264A; color-scheme:dark}}\n:root[data-theme=\&quot;dark\&quot;]{\n  --bg:#081228; --panel:#0F1D3A; --ink:#E9EEF8; --muted:#9AA6C0; --line:#22345A;\n  --navy:#9DB8F0; --red:#FF4B3F; --switch-bg:#16264A; color-scheme:dark}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}\n.wrap{max-width:1320px;margin:0 auto;display:grid;gap:20px}\nheader{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}\n.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:0}\nh1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4.5vw,48px);line-height:1;margin:4px 0 0;color:var(--navy);text-wrap:balance}\n.switch{display:inline-flex;background:var(--switch-bg);border-radius:999px;padding:4px;gap:2px;position:relative}\n.switch button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 15px/1 var(--f-body);\n  padding:11px 22px;border-radius:999px;cursor:pointer;position:relative;z-index:1;transition:color .2s}\n.switch button[aria-pressed=\&quot;true\&quot;]{color:#fff}\n.switch button:focus-visible{outline:2px solid var(--red);outline-offset:2px}\n.thumb{position:absolute;top:4px;bottom:4px;border-radius:999px;background:var(--red);transition:left .25s ease,width .25s ease;z-index:0}\n.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}\n@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}\n.viewport{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--stage-bg);border-radius:10px;overflow:hidden;border:1px solid var(--line)}\n.viewport canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}\n.viewport canvas:active{cursor:grabbing}\n.loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em}\n.tag{position:absolute;left:12px;top:12px;font-family:var(--f-mono);font-size:12px;color:#fff;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:6px;letter-spacing:.04em}\n.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}\naside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 18px 8px;min-width:0}\naside h2{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0 0 10px;color:var(--navy);letter-spacing:.01em}\ndl{margin:0 0 14px;display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:8px}\ndt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;color:var(--red);min-width:2ch;text-align:right}\ndd{margin:0;min-width:0}\ndd small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}\n.sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;border-top:1px solid var(--line);padding-top:12px}\n.sub:first-of-type{border-top:0;padding-top:0;margin-top:0}\n@media (prefers-reduced-motion:reduce){.thumb,.switch button{transition:none}}\n\n/* CodePen / Canva embed: fixed design width scaled to fit the frame */\nhtml,body{margin:0;overflow:hidden}\nbody{padding:0!important}\n.wrap{width:1320px;max-width:none;padding:20px 24px 24px;box-sizing:border-box;transform-origin:0 0}\n.main{grid-template-columns:minmax(0,1fr) 300px!important}\n&quot;, &quot;js&quot;: &quot;&quot;, &quot;editors&quot;: &quot;100&quot;}">
