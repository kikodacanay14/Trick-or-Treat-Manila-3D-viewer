<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulip Awards Layout</title>
<style>html,body{margin:0;padding:0;background:#fbf6f0}
.ta{font-family:Inter,Helvetica,Arial,sans-serif;display:grid;grid-template-columns:1fr 260px;gap:14px;
background:#fbf6f0;padding:14px;box-sizing:border-box;color:#404040}
.ta .map{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.ta .map svg{display:block;width:100%;height:auto}
.ta #base{transition:opacity .35s}
.ta.any #base{opacity:.6}
.ta .layer{opacity:0;transition:opacity .35s}
.ta .layer.on{opacity:1}
.ta .box{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);
display:flex;flex-direction:column;gap:6px;align-self:start;border-top:6px solid #f08c40}
.ta .hd{padding-bottom:10px;border-bottom:1px solid #f1e6da;margin-bottom:4px}
.ta .hd small{display:block;color:#777;font-size:11px;letter-spacing:.02em}
.ta .hd b{display:block;font-size:20px;color:#404040;line-height:1.2}
.ta .hd em{display:block;font-style:normal;color:#f08c3e;font-size:13px}
.ta .sw{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px;border-radius:10px;transition:background .2s;position:relative}
.ta .sw:hover{background:#fbf1e7}
.ta .sw input{position:absolute;opacity:0}
.ta .track{flex:none;width:38px;height:22px;border-radius:11px;background:#d9d3cb;position:relative;transition:background .25s;margin-top:1px}
.ta .knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;
box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .25s}
.ta .sw input:checked+.track{background:var(--c)}
.ta .sw input:checked+.track .knob{transform:translateX(16px)}
.ta .sw input:focus-visible+.track{outline:2px solid #23356b;outline-offset:2px}
.ta .txt b{display:block;font-size:13px}
.ta .txt small{display:block;font-size:11px;color:#777;line-height:1.3;margin-top:2px}
.ta .btns{display:flex;gap:8px;margin-top:6px}
.ta .btns button{flex:1;font:inherit;font-size:12px;font-weight:600;padding:8px;border-radius:8px;
border:1px solid #23356b;background:#fff;color:#23356b;cursor:pointer}
.ta .btns button[data-all="1"]{background:#23356b;color:#fff}
@media (max-width:760px){.ta{grid-template-columns:1fr}}
</style>
</head>

<script>
(function(){
var root=document.querySelector('.ta'),boxes=root.querySelectorAll('.sw input');
function sync(){var any=false;boxes.forEach(function(b){
document.getElementById('L-'+b.dataset.layer).classList.toggle('on',b.checked);any=any||b.checked;});
root.classList.toggle('any',any);}
boxes.forEach(function(b){b.addEventListener('change',sync);});
root.querySelectorAll('.btns button').forEach(function(btn){btn.addEventListener('click',function(){
boxes.forEach(function(b){b.checked=btn.dataset.all==='1';});sync();});});
sync();})();
</script>
